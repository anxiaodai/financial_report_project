name: Deploy Vite Vue3 App to GitHub Pages

# 1. 触发条件
on:
  push:
    branches: [main]   # 当 main 分支有代码推送时自动运行

# 2. 权限设置（GitHub Pages 必须）
permissions:
  contents: read
  pages: write
  id-token: write

# 3. 定义两个任务：构建 → 部署
jobs:
  build:
    runs-on: ubuntu-latest   # 使用 GitHub 托管的最新 Ubuntu 环境
    steps:
      # 3.1 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 3.2 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20       # 建议和你本地开发版本一致
          cache: 'npm'           # 自动缓存 node_modules，加速后续构建

      # 3.3 安装依赖（使用 npm ci 确保版本锁定）
      - name: Install dependencies
        run: npm ci

      # 3.4 构建项目（这里会注入环境变量）
      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}   # 从仓库变量读取
          VITE_USE_MOCK: false                                # 生产环境必须关掉 Mock

      # 3.5 将构建产物 dist 上传为工作流构件
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'   # 你的 Vite 打包输出目录，如果不是 dist 请修改

  deploy:
    needs: build           # 必须等 build 成功后才能运行
    runs-on: ubuntu-latest
    environment:
      name: github-pages   # 使用 GitHub Pages 专用环境
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4